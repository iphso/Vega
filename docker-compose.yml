services:
  preprocess:
    build: .
    volumes:
      - ./output:/work/output
      - ./scripts:/work/scripts
      - ./viewer:/work/viewer
      - ./vega_testing:/work/vega_testing:ro
      - hf-cache:/root/.cache/huggingface
    entrypoint: ["python3"]

  train:
    build:
      context: .
      dockerfile: Dockerfile.train
    runtime: nvidia
    gpus: all
    volumes:
      - ./output:/work/output
      - ./scripts:/work/scripts
      - ./checkpoints:/work/checkpoints
    entrypoint: ["python3"]

  oracle:
    build:
      context: .
      dockerfile: Dockerfile.oracle
    volumes:
      - ./output:/work/output
      - ./scripts:/work/scripts
      - ./vega_testing:/work/vega_testing:ro
      - ./tests:/work/tests
    entrypoint: ["python3"]

  warp:
    # GPU-accelerated 3D FEM (warp.fem) for the bracket topology-optimization
    # domain rebuild -- see Dockerfile.warp's own header comment for why
    # this replaces the fully-removed self-written scipy solver.
    build:
      context: .
      dockerfile: Dockerfile.warp
    runtime: nvidia
    gpus: all
    volumes:
      - ./output:/work/output
      - ./scripts:/work/scripts
      - ./checkpoints:/work/checkpoints
    entrypoint: ["python3"]

  oracle-x86:
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile.vmecpp
    volumes:
      - ./output:/work/output
      - ./scripts:/work/scripts
      - ./vega_testing:/work/vega_testing
      - ./tests:/work/tests
    entrypoint: ["python3"]

  torax:
    build:
      context: .
      dockerfile: Dockerfile.torax
    volumes:
      - ./output:/work/output
      - ./scripts:/work/scripts
      - ./checkpoints:/work/checkpoints
    entrypoint: ["python3"]

  pytest:
    build:
      context: .
      dockerfile: Dockerfile.oracle
    volumes:
      - ./scripts:/work/scripts
      - ./vega_testing:/work/vega_testing:ro
      - ./tests:/work/tests
    working_dir: /work
    entrypoint: ["python3", "-m", "pytest"]
    command: ["/work/tests", "-q"]

  meep:
    # Photonics domain's oracle backend -- real conda-forge MEEP (FDTD),
    # see Dockerfile.meep's own header comment for why this needs a
    # standalone image (same "hard version/packaging conflict" shape as
    # torax/openfoam, just conda- instead of Docker-base-image-driven).
    build:
      context: .
      dockerfile: Dockerfile.meep
    volumes:
      - ./output:/work/output
      - ./scripts:/work/scripts
      - ./checkpoints:/work/checkpoints
    entrypoint: ["python3"]

  physics:
    build:
      context: .
      dockerfile: Dockerfile.oracle
    volumes:
      - ./output:/work/output
      - ./scripts:/work/scripts
      - ./vega_testing:/work/vega_testing:ro
      - ./tests:/work/tests
    ports:
      - "8090:8090"
    command:
      - "-m"
      - "uvicorn"
      - "physics_service:app"
      - "--app-dir"
      - "/work/scripts"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8090"
      - "--reload"
      - "--reload-dir"
      - "/work/scripts"

  physics-airfoil:
    # Airfoil viewer's backend (airfoil_physics_service.py) needs XFOIL,
    # which only lives in Dockerfile.train (not Dockerfile.oracle, which the
    # VMEC++/DESC `physics` service above uses) -- no GPU needed here (XFOIL
    # and FastAPI are both CPU-only), so no runtime:nvidia/gpus: unlike the
    # `train` service itself.
    build:
      context: .
      dockerfile: Dockerfile.train
    volumes:
      - ./output:/work/output
      - ./scripts:/work/scripts
    ports:
      - "8091:8091"
    command:
      - "-m"
      - "uvicorn"
      - "airfoil_physics_service:app"
      - "--app-dir"
      - "/work/scripts"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8091"
      - "--reload"
      - "--reload-dir"
      - "/work/scripts"

  physics-torax:
    # TORAX viewer's backend (torax_physics_service.py) -- needs the torax
    # package (only in Dockerfile.torax's Python 3.12/numpy>=2 image, per
    # §25's conflict) plus fastapi/uvicorn (added there in §40). No GPU
    # needed (CPU-only, matching the torax service above).
    build:
      context: .
      dockerfile: Dockerfile.torax
    volumes:
      - ./output:/work/output
      - ./scripts:/work/scripts
    ports:
      - "8092:8092"
    command:
      - "-m"
      - "uvicorn"
      - "torax_physics_service:app"
      - "--app-dir"
      - "/work/scripts"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8092"
      - "--reload"
      - "--reload-dir"
      - "/work/scripts"

  physics-mug:
    # Mug viewer's backend (mug_physics_service.py) -- unlike every other
    # physics-* service, needs nothing exotic (pure numpy/scipy, same
    # reason this whole domain was picked in §46/§48 as deliberately
    # CPU-only/no-GPU/no-license-risk), so it reuses the plain base image
    # (`build: .`, same as `preprocess`) rather than a dedicated Dockerfile
    # -- just needed scipy/fastapi/uvicorn added there.
    build: .
    volumes:
      - ./output:/work/output
      - ./scripts:/work/scripts
    ports:
      - "8093:8093"
    command:
      - "-m"
      - "uvicorn"
      - "mug_physics_service:app"
      - "--app-dir"
      - "/work/scripts"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8093"
      - "--reload"
      - "--reload-dir"
      - "/work/scripts"

  physics-photonics:
    # Photonics viewer's backend (photonics_physics_service.py) -- needs
    # real MEEP, only in Dockerfile.meep (see that file/photonics_oracle.py's
    # own header comments). No GPU needed (MEEP + FastAPI are both
    # CPU-only), matching physics-airfoil/physics-torax's own no-GPU config.
    build:
      context: .
      dockerfile: Dockerfile.meep
    volumes:
      - ./output:/work/output
      - ./scripts:/work/scripts
    ports:
      - "8094:8094"
    entrypoint: ["python3"]
    command:
      - "-m"
      - "uvicorn"
      - "photonics_physics_service:app"
      - "--app-dir"
      - "/work/scripts"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8094"
      - "--reload"
      - "--reload-dir"
      - "/work/scripts"

  viewer:
    build:
      context: .
      dockerfile: Dockerfile.viewer
    volumes:
      - ./viewer:/work/viewer
      - viewer-node-modules:/work/viewer/node_modules
    ports:
      - "4321:4321"

volumes:
  hf-cache:
  viewer-node-modules:
