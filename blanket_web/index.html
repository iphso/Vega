<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blanket Simulator</title>
<style>
/* One simulator for a FLiBe immersion blanket: designs on the left, the selected
   design's cross-section and parameters in the middle, its metrics and the fidelity
   it was run at on the right. Same ground as the newwater simulator. */
:root {
  --bg: #0c0c0e; --panel: #16161a; --card: #1c1c21; --card-2: #202027;
  --ink: #e8e8ec; --ink-2: #8a8a94; --ink-3: #55555e; --rule: #2a2a30;
  --flibe: #4fb3d9; --flibe-dim: #1f4a5c; --heat: #ffb547; --trit: #9b8cff;
  --good: #7ee0a8; --bad: #ff8a7a; --warn: #ffcf6e;
  --f-body: -apple-system, "Segoe UI", system-ui, sans-serif;
  --f-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font: 400 13px/1.45 var(--f-body); height: 100%; }
button { font: inherit; color: inherit; }
select, input { font: 400 12px var(--f-body); padding: 4px 6px; border-radius: 6px; border: 1px solid var(--rule); background: var(--card-2); color: var(--ink); }
input[type=number] { width: 100%; font-family: var(--f-mono); }
h2 { font: 600 10.5px/1.2 var(--f-body); text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-3); margin: 0; }
a { color: var(--flibe); }
.btn { font: 500 12px/1 var(--f-body); padding: 7px 11px; border-radius: 8px; border: 1px solid var(--rule); background: var(--card-2); cursor: pointer; }
.btn:hover { border-color: var(--ink-3); }
.btn.primary { background: var(--flibe-dim); border-color: var(--flibe-dim); font-weight: 600; }

.app { display: grid; grid-template-rows: auto 1fr; height: 100vh; }
header.top { display: flex; align-items: center; gap: 14px; padding: 10px 16px; border-bottom: 1px solid var(--rule); flex-wrap: wrap; }
header.top h1 { font: 600 14px/1.2 var(--f-body); margin: 0; }
header.top .sub { font-size: 12px; color: var(--ink-2); }
header.top .right { margin-left: auto; display: flex; gap: 12px; align-items: center; font-size: 12px; color: var(--ink-3); }
.work { display: grid; grid-template-columns: 260px minmax(0, 1fr) 330px; min-height: 0; }
.pn { display: flex; flex-direction: column; min-width: 0; min-height: 0; border-right: 1px solid var(--rule); }
.pn:last-child { border-right: 0; }
.pb { flex: 1 1 0; min-height: 0; overflow: auto; }
@media (max-width: 1100px) { .app { height: auto; } .work { display: block; } .pn { border-right: 0; border-bottom: 1px solid var(--rule); } }

/* designs */
.lhead { position: sticky; top: 0; background: var(--bg); z-index: 2; padding: 10px 12px 8px; border-bottom: 1px solid var(--rule); display: grid; gap: 6px; }
.gtitle { padding: 12px 12px 4px; }
.item { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 8px; align-items: center; padding: 7px 12px; border-left: 2px solid transparent; cursor: pointer; }
.item:hover { background: var(--panel); }
.item[aria-selected="true"] { background: var(--card); border-left-color: var(--flibe); }
.item .nm { font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item .ref { font: 600 9px/1 var(--f-body); letter-spacing: 0.05em; color: var(--good); border: 1px solid #2c6b4a; border-radius: 4px; padding: 2px 4px; }
.item .mx { grid-column: 1 / 3; display: flex; gap: 10px; font: 400 11px var(--f-mono); color: var(--ink-2); min-height: 15px; }
.item .mx b { color: var(--ink); font-weight: 500; }

/* stage */
.center { display: flex; flex-direction: column; min-height: 0; }
.dhead { display: flex; align-items: center; gap: 10px; padding: 12px 16px 0; flex-wrap: wrap; }
.dhead .name { font: 600 16px/1.2 var(--f-body); background: transparent; border: 1px solid transparent; padding: 2px 4px; border-radius: 6px; width: min(36ch, 100%); }
.dhead .name:hover { border-color: var(--rule); }
.dhead .acts { margin-left: auto; display: flex; gap: 6px; }
.view { position: relative; margin: 10px 12px; border: 1px solid var(--rule); border-radius: 10px; overflow: hidden; background: #0f0f12; flex: 1 1 52%; min-height: 280px; }
.view canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.vtop { position: absolute; left: 10px; top: 10px; display: flex; gap: 4px; z-index: 5; flex-wrap: wrap; }
.view.in3d .vtop { top: auto; bottom: 10px; }
.vtop button { font: 500 11px/1 var(--f-body); padding: 6px 10px; border-radius: 14px; border: 1px solid var(--rule); background: rgba(22,22,26,0.85); color: var(--ink-2); cursor: pointer; }
.vtop button[aria-pressed="true"] { color: var(--ink); border-color: var(--flibe-dim); background: rgba(31,74,92,0.9); }
.legend { position: absolute; left: 10px; bottom: 10px; display: grid; gap: 4px; font: 400 11px/1.2 var(--f-mono); color: var(--ink-2); background: rgba(22,22,26,0.8); border: 1px solid var(--rule); border-radius: 8px; padding: 6px 8px; pointer-events: none; }
.legend i { width: 110px; height: 7px; border-radius: 4px; display: inline-block; }
.keys { position: absolute; right: 10px; top: 10px; display: grid; gap: 3px; font-size: 11px; color: var(--ink-2); background: rgba(22,22,26,0.8); border: 1px solid var(--rule); border-radius: 8px; padding: 6px 8px; pointer-events: none; }
.keys span { display: flex; gap: 6px; align-items: center; }
.keys i { width: 9px; height: 9px; border-radius: 2px; display: inline-block; }
.tip { position: absolute; pointer-events: none; background: var(--card); border: 1px solid var(--rule); border-radius: 6px; padding: 5px 8px; font: 400 11px var(--f-mono); color: var(--ink-2); white-space: nowrap; z-index: 3; }
.tip b { color: var(--ink); font-weight: 500; }
.params { padding: 6px 16px 24px; display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); overflow: auto; flex: 1 1 40%; min-height: 0; }
.pgroup { display: grid; gap: 6px; align-content: start; }
.prow { display: grid; grid-template-columns: minmax(0, 1fr) 86px; gap: 8px; align-items: center; font-size: 12px; color: var(--ink-2); }
.prow .u { font-size: 10.5px; color: var(--ink-3); }
.prow.changed { color: var(--ink); }
.prow.changed input, .prow.changed select { border-color: var(--flibe-dim); }

/* metrics + fidelity */
.side { padding: 14px; display: grid; gap: 16px; align-content: start; }
.kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.kpi { background: var(--card); border: 1px solid var(--rule); border-radius: 8px; padding: 9px 10px; display: grid; gap: 2px; }
.kpi .k { font: 600 9.5px/1.2 var(--f-body); letter-spacing: 0.07em; text-transform: uppercase; color: var(--ink-3); }
.kpi .v { font: 600 21px/1.1 var(--f-body); font-variant-numeric: tabular-nums; }
.kpi .s { font-size: 11px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.kpi .v.good { color: var(--good); } .kpi .v.bad { color: var(--bad); } .kpi .v.warn { color: var(--warn); }
.kpis.stale .v { color: var(--ink-3); }
.ladder { display: grid; gap: 6px; }
.rung { display: grid; grid-template-columns: 76px minmax(0, 1fr) auto; gap: 8px; align-items: center; background: var(--panel); border: 1px solid var(--rule); border-radius: 8px; padding: 7px 9px; cursor: pointer; text-align: left; }
.rung[aria-current="true"] { border-color: var(--flibe-dim); background: var(--card); }
.rung.na { opacity: 0.4; cursor: default; }
.rung .tn { font: 600 12px var(--f-body); }
.rung .ts { font: 400 11px var(--f-mono); color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rung .tr { font: 400 11px var(--f-mono); color: var(--ink-3); }
.rung .bar { grid-column: 1 / 4; height: 3px; border-radius: 2px; background: var(--card-2); overflow: hidden; }
.rung .bar span { display: block; height: 100%; width: 0; background: var(--flibe); transition: width .2s; }
.bars { display: grid; gap: 5px; }
.brow { display: grid; grid-template-columns: 92px minmax(0, 1fr) 58px; gap: 8px; align-items: center; font-size: 11.5px; color: var(--ink-2); }
.brow .track { height: 8px; background: var(--card-2); border-radius: 4px; overflow: hidden; position: relative; }
.brow .track span { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px; }
.brow .track em { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--ink); opacity: 0.7; }
.brow .n { text-align: right; font: 400 11px var(--f-mono); color: var(--ink); }
.note { font-size: 11.5px; color: var(--ink-3); line-height: 1.5; }
.err { grid-column: 1 / -1; margin: 40px auto; max-width: 520px; padding: 16px; border: 1px solid var(--bad); border-radius: 10px; color: var(--ink-2); }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <h1>Blanket Simulator</h1>
    <span class="sub">FLiBe immersion blanket · neutronics, heat and tritium in the browser</span>
    <span class="right"><span id="store"></span><span id="gpu"></span><a href="validation.html">Validation</a></span>
  </header>
  <div class="work">
    <section class="pn" aria-label="Designs">
      <div class="lhead"><h2>Designs</h2></div>
      <div class="pb" id="list"></div>
    </section>
    <section class="center" aria-label="Design">
      <div class="dhead">
        <input class="name" id="dname" aria-label="Design name">
        <span class="acts"><button type="button" class="btn" id="dreset">Reset</button><button type="button" class="btn" id="dsave">Save as new design</button><button type="button" class="btn" id="ddel" hidden>Delete</button></span>
      </div>
      <div class="view" id="view">
        <canvas id="cv" aria-label="Poloidal cross-section"></canvas>
        <div class="vtop" id="layers"><button type="button" data-f="heat" aria-pressed="true">Heating</button><button type="button" data-f="trit" aria-pressed="false">Tritium production</button><button type="button" data-f="conc" aria-pressed="false">Tritium in salt</button><button type="button" data-f="temp" aria-pressed="false">Vessel temperature</button><button type="button" data-f="none" aria-pressed="false">Materials</button><button type="button" data-f="3d" aria-pressed="false">3D</button></div>
        <div id="v3" hidden style="position:absolute;inset:0"></div>
        <div class="keys" id="keys"></div>
        <div class="legend" id="legend" hidden></div>
        <div class="tip" id="tip" hidden></div>
      </div>
      <div class="params" id="params"></div>
    </section>
    <section class="pn" aria-label="Metrics">
      <div class="pb side">
        <div class="kpis" id="kpis"></div>
        <div><h2 style="margin-bottom:8px">Fidelity</h2><div class="ladder" id="ladder"></div></div>
        <div><h2 style="margin-bottom:8px">Nuclear heating</h2><div class="bars" id="heat"></div></div>
        <div class="note" id="notes"></div>
      </div>
    </section>
  </div>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
