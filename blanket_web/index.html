<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blanket Simulator</title>
<style>
/* One simulator for a FLiBe immersion blanket: designs on the left, the selected
   design's cross-section and parameters in the middle, its metrics and the fidelity
   it was run at on the right. Same ground as the newwater simulator. */
:root {
  --bg: #0c0c0e; --panel: #16161a; --card: #1c1c21; --card-2: #202027;
  --ink: #e8e8ec; --ink-2: #8a8a94; --ink-3: #55555e; --rule: #2a2a30;
  --flibe: #4fb3d9; --flibe-dim: #1f4a5c; --heat: #ffb547; --trit: #9b8cff;
  --good: #7ee0a8; --bad: #ff8a7a; --warn: #ffcf6e;
  --f-body: -apple-system, "Segoe UI", system-ui, sans-serif;
  --f-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font: 400 13px/1.45 var(--f-body); height: 100%; }
button { font: inherit; color: inherit; }
select, input { font: 400 12px var(--f-body); padding: 4px 6px; border-radius: 6px; border: 1px solid var(--rule); background: var(--card-2); color: var(--ink); }
input[type=number] { width: 100%; font-family: var(--f-mono); }
h2 { font: 600 10.5px/1.2 var(--f-body); text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-3); margin: 0; }
a { color: var(--flibe); }
.btn { font: 500 12px/1 var(--f-body); padding: 7px 11px; border-radius: 8px; border: 1px solid var(--rule); background: var(--card-2); cursor: pointer; }
.btn:hover { border-color: var(--ink-3); }
.btn.primary { background: var(--flibe-dim); border-color: var(--flibe-dim); font-weight: 600; }

.app { display: grid; grid-template-rows: auto 1fr; height: 100vh; }
header.top { display: flex; align-items: center; gap: 14px; padding: 10px 16px; border-bottom: 1px solid var(--rule); flex-wrap: wrap; }
header.top h1 { font: 600 14px/1.2 var(--f-body); margin: 0; }
header.top .sub { font-size: 12px; color: var(--ink-2); }
header.top .right { margin-left: auto; display: flex; gap: 12px; align-items: center; font-size: 12px; color: var(--ink-3); }
/* panes: Designs | (View / Parameters) | Metrics, as in the newwater simulator. Dividers drag
   (double-click resets), x closes a pane and the rest take its room, + in the header reopens it. */
.work { display: flex; min-height: 0; }
.pn { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.center { display: flex; flex-direction: column; min-width: 0; min-height: 0; flex: 1 1 0; }
.pn[hidden], .gut[hidden], .center[hidden] { display: none; }
.ph { flex: none; display: flex; align-items: center; justify-content: space-between; height: 28px; padding: 0 4px 0 12px; font: 500 11px/1 var(--f-body); color: var(--ink-3); border-bottom: 1px solid var(--rule); user-select: none; }
.px { border: 0; background: none; color: var(--ink-3); font-size: 15px; line-height: 1; width: 22px; height: 22px; border-radius: 5px; cursor: pointer; }
.px:hover { background: var(--card); color: var(--ink); }
.pb { flex: 1 1 0; min-height: 0; overflow: auto; }
.gut { flex: none; position: relative; z-index: 7; }
.gut.v { width: 1px; background: var(--rule); cursor: col-resize; }
.gut.h { height: 1px; background: var(--rule); cursor: row-resize; }
.gut::after { content: ""; position: absolute; inset: -4px; }
.gut.v::after { inset: 0 -4px; } .gut.h::after { inset: -4px 0; }
.gut:hover, .gut.drag { background: var(--flibe); }
body.dragging { user-select: none; } body.dragging.v { cursor: col-resize; } body.dragging.h { cursor: row-resize; }
body.dragging canvas, body.dragging #v3 { pointer-events: none; }
.reopen { display: inline-flex; gap: 6px; }
.reopen button { font: 500 11px/1 var(--f-body); padding: 5px 9px; border-radius: 14px; border: 1px dashed var(--rule); background: none; color: var(--ink-2); cursor: pointer; }
.reopen button:hover { border-color: var(--ink-3); color: var(--ink); }
@media (max-width: 1100px) {
  /* phone / tablet: one column -- design, its view, its metrics, then the parameters and the list */
  .app { height: auto; }
  .work { display: flex; flex-direction: column; }
  .center { display: contents; }
  .gut { display: none !important; }
  .pn { width: auto !important; flex: none !important; border-bottom: 1px solid var(--rule); }
  .dhead { order: 1; } .pn[data-pane="view"] { order: 2; } .pn[data-pane="view"] .view { min-height: 340px; flex: none; height: 52vh; }
  .pn[data-pane="metrics"] { order: 3; } .pn[data-pane="params"] { order: 4; } .pn[data-pane="params"] .pb { overflow: visible; }
  .pn[data-pane="designs"] { order: 5; }
  .pb { flex: none; overflow: visible; } .pn[data-pane="designs"] .pb { max-height: 50vh; overflow: auto; }
  .keys { display: none !important; }
  .legend { left: auto; right: 10px; }
  .view .inset canvas { width: 240px; height: 130px; }
}

/* designs */
.lhead { position: sticky; top: 0; background: var(--bg); z-index: 2; padding: 10px 12px 8px; border-bottom: 1px solid var(--rule); display: grid; gap: 6px; }
.gtitle { padding: 12px 12px 4px; }
.item { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 8px; align-items: center; padding: 7px 12px; border-left: 2px solid transparent; cursor: pointer; }
.item:hover { background: var(--panel); }
.item[aria-selected="true"] { background: var(--card); border-left-color: var(--flibe); }
.item .nm { font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item .ref { font: 600 9px/1 var(--f-body); letter-spacing: 0.05em; color: var(--good); border: 1px solid #2c6b4a; border-radius: 4px; padding: 2px 4px; }
.item .mx { grid-column: 1 / 3; display: flex; gap: 10px; font: 400 11px var(--f-mono); color: var(--ink-2); min-height: 15px; }
.item .mx b { color: var(--ink); font-weight: 500; }

/* stage */
.dhead { display: flex; align-items: center; gap: 10px; padding: 8px 16px; flex-wrap: wrap; border-bottom: 1px solid var(--rule); }
.dhead .name { font: 600 16px/1.2 var(--f-body); background: transparent; border: 1px solid transparent; padding: 2px 4px; border-radius: 6px; width: min(36ch, 100%); }
.dhead .name:hover { border-color: var(--rule); }
.dhead .acts { margin-left: auto; display: flex; gap: 6px; }
.view { position: relative; overflow: hidden; background: #0f0f12; flex: 1 1 0; min-height: 0; }
.view canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.vtop { position: absolute; left: 10px; top: 10px; display: flex; gap: 4px; z-index: 5; flex-wrap: wrap; }
.view.in3d .vtop { top: auto; bottom: 10px; }
.vtop button { font: 500 11px/1 var(--f-body); padding: 6px 10px; border-radius: 14px; border: 1px solid var(--rule); background: rgba(22,22,26,0.85); color: var(--ink-2); cursor: pointer; }
.view:not(.in3d) .vtop button[aria-pressed="true"], .vtop button[data-f="3d"][aria-pressed="true"] { color: var(--ink); border-color: var(--flibe-dim); background: rgba(31,74,92,0.9); }
.vtop .vc { padding: 6px 10px; color: var(--ink-2); font-weight: 600; }
.vtop.min button:not(.vc):not([aria-pressed="true"]), .view.in3d .vtop.min button:not(.vc):not([data-f="3d"]), .view:not(.in3d) .vtop.min button[data-f="3d"] { display: none; }
/* overlays on the view: each collapses to its title chip */
.ov { position: absolute; z-index: 4; display: grid; gap: 4px; font: 400 11px/1.2 var(--f-mono); color: var(--ink-2); background: rgba(22,22,26,0.85); border: 1px solid var(--rule); border-radius: 8px; padding: 5px 8px 6px; }
.ov .oh { display: flex; align-items: center; gap: 8px; justify-content: space-between; font: 500 10.5px/1.2 var(--f-body); color: var(--ink-2); cursor: pointer; user-select: none; }
.ov .oc { border: 0; background: none; color: var(--ink-3); cursor: pointer; padding: 0 2px; font-size: 13px; line-height: 1; }
.ov .oc:hover, .ov .oh:hover .oc { color: var(--ink); }
.ov.min { padding: 4px 8px; border-radius: 12px; }
.ov.min .ob { display: none; }
.ov .ob { display: grid; gap: 3px; }
.legend { left: 10px; bottom: 10px; }
.legend i { width: 110px; height: 7px; border-radius: 4px; display: inline-block; }
.keys { right: 10px; top: 10px; font: 400 11px var(--f-body); }
.keys .ob span { display: flex; gap: 6px; align-items: center; }
.inset { left: 10px; top: 46px; }
.phictl { left: 10px; top: 10px; }
.phictl .ob { display: flex; gap: 8px; align-items: center; }
.phictl input { width: 140px; accent-color: var(--flibe); }
.view .inset canvas { position: static; display: block; width: 300px; height: 150px; }
.gtip { position: fixed; z-index: 50; max-width: 300px; background: var(--card-2); border: 1px solid var(--ink-3); border-radius: 8px; padding: 7px 9px; font: 400 11.5px/1.45 var(--f-body); color: var(--ink); white-space: pre-line; pointer-events: none; box-shadow: 0 6px 20px rgba(0,0,0,0.5); }
[data-tip] { cursor: help; }
.kpi .k[data-tip], .prow > span[data-tip], h2[data-tip], .sub[data-tip] { text-decoration: underline dotted var(--ink-3); text-underline-offset: 3px; }
.kpi .k .w { color: var(--warn); text-decoration: none; margin-left: 4px; }
.keys i { width: 9px; height: 9px; border-radius: 2px; display: inline-block; }
.tip { position: absolute; pointer-events: none; background: var(--card); border: 1px solid var(--rule); border-radius: 6px; padding: 5px 8px; font: 400 11px var(--f-mono); color: var(--ink-2); white-space: nowrap; z-index: 3; }
.tip b { color: var(--ink); font-weight: 500; }
.params { padding: 12px 16px 24px; display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); }
.pgroup { display: grid; gap: 6px; align-content: start; }
.prow { display: grid; grid-template-columns: minmax(0, 1fr) 86px 22px; gap: 6px; align-items: center; font-size: 12px; color: var(--ink-2); }
.prow .u { font-size: 10.5px; color: var(--ink-3); }
.prow.changed { color: var(--ink); }
.prow.changed input, .prow.changed select { border-color: var(--flibe-dim); }
.swb { width: 22px; height: 22px; padding: 0; border-radius: 6px; border: 1px solid var(--rule); background: transparent; color: var(--ink-3); cursor: pointer; display: grid; place-items: center; }
.swb svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.swb:hover { color: var(--ink); border-color: var(--ink-3); }
.swb[aria-pressed="true"] { color: var(--ink); background: var(--flibe-dim); border-color: var(--flibe-dim); }

/* sweep: small multiples over the view */
.sweep { position: absolute; inset: 0; z-index: 6; background: #0f0f12; display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 6px; padding: 10px 12px 8px; }
.sweep .sh { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; font-size: 12px; color: var(--ink-2); padding-right: 30px; }
.sweep .sh b { color: var(--ink); font-weight: 600; }
.sweep .u { color: var(--ink-3); font-size: 11px; }
.sweep .x { position: absolute; right: 10px; top: 8px; width: 24px; height: 24px; border-radius: 6px; border: 1px solid var(--rule); background: var(--card-2); cursor: pointer; line-height: 1; }
.sweep .hxv { font: 400 11px var(--f-mono); color: var(--ink); }
.swg { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 8px; min-height: 0; overflow: hidden; }
@media (max-width: 700px) { .swg { grid-template-columns: 1fr; grid-template-rows: none; grid-auto-rows: 150px; overflow: auto; } }
.swc { display: grid; grid-template-rows: auto minmax(0, 1fr); min-width: 0; min-height: 0; overflow: hidden; background: var(--panel); border: 1px solid var(--rule); border-radius: 8px; padding: 6px 8px 2px; }
.swt { font-size: 11.5px; color: var(--ink-2); }
.swt b { color: var(--ink); font: 500 11.5px var(--f-mono); margin-left: 4px; }
.swc svg { display: block; cursor: crosshair; overflow: visible; }
.swc .g { stroke: #24242a; } .swc .ax { font: 400 10px var(--f-mono); fill: #8a8a94; }
.swc .gd { stroke: var(--ink-3); stroke-dasharray: 4 3; } .swc .gl { font: 400 10px var(--f-body); fill: var(--ink-2); }
.swc .cur { stroke: var(--ink-2); stroke-dasharray: 2 3; } .swc .hx { stroke: var(--ink-3); }
.swc .ln { fill: none; stroke: var(--flibe); stroke-width: 2; stroke-linejoin: round; }
.swc .eb { stroke: var(--flibe); stroke-width: 1.5; opacity: 0.6; }
.swc .pt { fill: var(--flibe); stroke: #0f0f12; stroke-width: 2; }
.swc .pt.on { fill: var(--ink); } .swc .pt.hv { stroke: var(--ink); stroke-width: 1.5; }
.view.insweep .vtop, .view.insweep .ov { display: none; }

/* metrics + fidelity */
.side { padding: 14px; display: grid; gap: 16px; align-content: start; }
.kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.kpi { background: var(--card); border: 1px solid var(--rule); border-radius: 8px; padding: 9px 10px; display: grid; gap: 2px; }
.kpi .k { font: 600 9.5px/1.2 var(--f-body); letter-spacing: 0.07em; text-transform: uppercase; color: var(--ink-3); }
.kpi .v { font: 600 21px/1.1 var(--f-body); font-variant-numeric: tabular-nums; }
.kpi .s { font-size: 11px; color: var(--ink-3); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kpi .v.good { color: var(--good); } .kpi .v.bad { color: var(--bad); } .kpi .v.warn { color: var(--warn); }
.kpis.stale .v { color: var(--ink-3); }
.lnk { background: none; border: 0; padding: 0; color: var(--flibe); cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
.ladder { display: grid; gap: 6px; }
.rung { display: grid; grid-template-columns: 76px minmax(0, 1fr) auto; gap: 8px; align-items: center; background: var(--panel); border: 1px solid var(--rule); border-radius: 8px; padding: 7px 9px; cursor: pointer; text-align: left; }
.rung[aria-current="true"] { border-color: var(--flibe-dim); background: var(--card); }
.rung.na { opacity: 0.4; cursor: default; }
.rung .tn { font: 600 12px var(--f-body); }
.rung .ts { font: 400 11px var(--f-mono); color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rung .tr { font: 400 11px var(--f-mono); color: var(--ink-3); }
.rung .bar { grid-column: 1 / 4; height: 3px; border-radius: 2px; background: var(--card-2); overflow: hidden; }
.rung .bar span { display: block; height: 100%; width: 0; background: var(--flibe); transition: width .2s; }
.bars { display: grid; gap: 5px; }
.brow { display: grid; grid-template-columns: 92px minmax(0, 1fr) 58px; gap: 8px; align-items: center; font-size: 11.5px; color: var(--ink-2); }
.brow .track { height: 8px; background: var(--card-2); border-radius: 4px; overflow: hidden; position: relative; }
.brow .track span { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px; }
.brow .track em { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--ink); opacity: 0.7; }
.brow .n { text-align: right; font: 400 11px var(--f-mono); color: var(--ink); }
.brow .track.ctr span, .srow .track.ctr span { border-radius: 0; }
.track.ctr::after { content: ""; position: absolute; left: 50%; top: -2px; bottom: -2px; width: 1px; background: var(--ink-3); }
.srow, .sensh { display: grid; grid-template-columns: 92px minmax(0, 1fr) 52px minmax(0, 1fr) 44px; gap: 6px; align-items: center; font-size: 11.5px; color: var(--ink-2); }
.srow .track { height: 8px; background: var(--card-2); border-radius: 4px; overflow: hidden; position: relative; }
.srow .track span { position: absolute; top: 0; bottom: 0; }
.srow .n { text-align: right; font: 400 11px var(--f-mono); color: var(--ink); }
.sensh { font: 600 9.5px/1.2 var(--f-body); letter-spacing: 0.07em; text-transform: uppercase; color: var(--ink-3); }
.sensh span:nth-child(2) { grid-column: 2 / 4; } .sensh span:nth-child(3) { grid-column: 4 / 6; }
#sens { display: grid; gap: 5px; }
.acttab { width: 100%; border-collapse: collapse; font-size: 11.5px; color: var(--ink-2); }
.acttab th { font: 600 9.5px/1.2 var(--f-body); letter-spacing: 0.07em; text-transform: uppercase; color: var(--ink-3); text-align: right; padding: 0 0 4px; }
.acttab th:first-child, .acttab td:first-child { text-align: left; }
.acttab td { text-align: right; font: 400 11px var(--f-mono); color: var(--ink); padding: 2px 0; }
.acttab td:first-child { font-family: var(--f-body); color: var(--ink-2); }
.note { font-size: 11.5px; color: var(--ink-3); line-height: 1.5; }
.err { grid-column: 1 / -1; margin: 40px auto; max-width: 520px; padding: 16px; border: 1px solid var(--bad); border-radius: 10px; color: var(--ink-2); }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <h1>Blanket Simulator</h1>
    <span class="sub" data-tip="Change any input and the neutronics, vessel heat and tritium re-run on your GPU in about a second.&#10;The chart button beside an input plots the results across that input's range.&#10;Drag the dividers to resize panes; × closes one.&#10;Hover a label for what it means.">Fusion blankets · runs on your GPU</span>
    <span class="reopen" id="reopen" aria-label="Closed panes"></span>
    <span class="right"><span id="store"></span><span id="gpu"></span><a href="reel.html">Reel</a><a href="validation.html">Validation</a></span>
  </header>
  <div class="work" id="work">
    <section class="pn" data-pane="designs" aria-label="Designs">
      <div class="ph"><span>Designs</span><button type="button" class="px" aria-label="Close Designs">×</button></div>
      <div class="pb" id="list"></div>
    </section>
    <div class="gut v" id="g1" role="separator" aria-orientation="vertical" aria-label="Resize Designs"></div>
    <div class="center" id="center">
      <div class="dhead">
        <input class="name" id="dname" aria-label="Design name">
        <span class="acts"><button type="button" class="btn" id="dlink">Copy link</button><button type="button" class="btn" id="dreset">Reset</button><button type="button" class="btn" id="dsave">Save as new design</button><button type="button" class="btn" id="ddel" hidden>Delete</button></span>
      </div>
      <section class="pn" data-pane="view" aria-label="View" style="flex: 1 1 0">
      <div class="ph"><span>View</span><button type="button" class="px" aria-label="Close View">×</button></div>
      <div class="view" id="view">
        <canvas id="cv" aria-label="Poloidal cross-section"></canvas>
        <div class="vtop" id="layers"><button type="button" data-f="heat" aria-pressed="true">Heating</button><button type="button" data-f="trit" aria-pressed="false">Tritium production</button><button type="button" data-f="conc" aria-pressed="false">Tritium in salt</button><button type="button" data-f="temp" aria-pressed="false">Vessel temperature</button><button type="button" data-f="none" aria-pressed="false">Materials</button><button type="button" data-f="3d" aria-pressed="false">3D</button><button type="button" class="vc" id="lcol" aria-label="Collapse the view options" aria-expanded="true">‹</button></div>
        <div id="v3" hidden style="position:absolute;inset:0"></div>
        <div class="sweep" id="sw" hidden><div class="sh" id="sw-head"></div><button type="button" class="x" id="sw-close" aria-label="Close the sweep">✕</button><div class="swg" id="sw-charts"></div></div>
        <div class="ov keys" id="keys" data-ov="keys"></div>
        <div class="ov legend" id="legend" data-ov="legend" hidden></div>
        <div class="ov phictl" id="phictl" data-ov="phictl" hidden><div class="oh"><span>Toroidal angle</span></div><div class="ob"><input type="range" id="phi" min="0" max="180" step="1" value="0" aria-label="Toroidal angle of the cut"><span id="phiv">0°</span></div></div>
        <div class="ov inset" id="inset" data-ov="inset" hidden><div class="oh"><span>Along the first wall</span><button type="button" class="oc" aria-label="Collapse">–</button></div><div class="ob"><canvas id="insetcv"></canvas></div></div>
        <div class="tip" id="tip" hidden></div>
      </div>
      </section>
      <div class="gut h" id="gh" role="separator" aria-orientation="horizontal" aria-label="Resize View and Parameters"></div>
      <section class="pn" data-pane="params" aria-label="Parameters" style="flex: 1 1 0">
        <div class="ph"><span>Parameters</span><button type="button" class="px" aria-label="Close Parameters">×</button></div>
        <div class="pb"><div class="params" id="params"></div></div>
      </section>
    </div>
    <div class="gut v" id="g2" role="separator" aria-orientation="vertical" aria-label="Resize Metrics"></div>
    <section class="pn" data-pane="metrics" aria-label="Metrics">
      <div class="ph"><span>Metrics</span><button type="button" class="px" aria-label="Close Metrics">×</button></div>
      <div class="pb side">
        <div class="kpis" id="kpis"></div>
        <div><h2 style="margin-bottom:8px" data-tip="Each design runs at Fast on every edit. Resolved runs 80× more neutrons and the recirculating tank flow. Reference is offline continuous-energy OpenMC.">Fidelity</h2><div class="ladder" id="ladder"></div></div>
        <div><h2 style="margin-bottom:8px" id="heat-h">Nuclear heating</h2><div class="bars" id="heat"></div></div>
        <div id="act-box" hidden><h2 style="margin-bottom:8px" data-tip="After one full-power year, then shutdown: the heat the activated materials still give off, and the gamma dose rate at contact with the inner vessel. From the chain of every neutron reaction and decay (ENDF/B-VIII.0), checked against OpenMC depletion within 2%. The dose is a ranking proxy (a thick slab of the material alone), not a plant dose map.">After shutdown</h2><div class="tablewrap"><table class="acttab" id="act"></table></div></div>
        <div><h2 style="margin-bottom:8px" data-tip="What a 10% denser layer would change, from one Monte Carlo run that carries the derivative along every neutron path. For thin layers that is the same as 10% thicker. Magnet fluence: the coils' fast-neutron dose (lower is better).">Which layer matters</h2><div id="sens"></div></div>
